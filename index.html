<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Long Game">
<meta name="theme-color" content="#0A060D">
<link rel="apple-touch-icon" href="icon.png">
<title>The Long Game — Longevity Training Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A060D; --panel:#120A16; --card:#170D1D; --card2:#1E1126; --line:#33203F;
  --chalk:#FDEFF8; --mist:#9A7FA0; --dim:#6B5272;
  --org:#FF2E97; --org-soft:#FF7AC0; --tape:#FCEE0A; --teal:#00F0FF;
  --board:#140A1C; --board2:#0E0714;
  --gold-hair:rgba(255,46,151,.34);
  --gold-grad:linear-gradient(135deg,#FF8AC7 0%,#FF2E97 50%,#C1006A 100%);
  --disp:'Rajdhani', system-ui, sans-serif;
  --body:'Rajdhani', system-ui, -apple-system, sans-serif;
  --mono:'Share Tech Mono', ui-monospace, monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tb{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--chalk);background:transparent;border:1px solid rgba(242,237,226,.25);border-radius:8px;padding:7px 11px;cursor:pointer}
.tb.on{border-color:var(--org);color:var(--org)}
/* gamification */
.gamebar{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 12px;border:1px solid rgba(242,237,226,.16);border-radius:12px;background:rgba(242,237,226,.03)}
.flame{font-family:var(--disp);font-size:15px;color:var(--yellow);white-space:nowrap}
.flame small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--mist);text-transform:uppercase}
.lvl{flex:1;min-width:0}
.lvl .lname{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk);display:flex;justify-content:space-between;margin-bottom:5px}
.lvl .lname b{color:var(--org)}
.xptrack{height:7px;border-radius:4px;background:rgba(242,237,226,.12);overflow:hidden}
.xpfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--org),var(--yellow));transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* weight logger */
.wrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.wbtn{width:44px;height:40px;border-radius:9px;border:1px solid rgba(242,237,226,.25);background:transparent;color:var(--chalk);font-family:var(--mono);font-size:13px;cursor:pointer}
.winp{width:86px;height:40px;border-radius:9px;border:1px solid rgba(255,122,47,.5);background:rgba(0,0,0,.25);color:var(--chalk);font-family:var(--disp);font-size:17px;text-align:center}
.wunit{font-family:var(--mono);font-size:11px;color:var(--mist)}
/* chart */
.chartwrap{margin-top:14px}
.chartwrap .cstats{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--mist);margin-bottom:6px}
.chartwrap .cstats b{color:var(--yellow)}
.chartbox{border:1px solid rgba(242,237,226,.14);border-radius:12px;background:var(--board2);padding:8px}
.chartempty{font-size:12.5px;color:var(--mist);padding:14px 10px;text-align:center}
/* toast + confetti */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#1c130c;border:1px solid var(--org);color:var(--chalk);font-family:var(--disp);font-size:14px;padding:12px 20px;border-radius:12px;z-index:99;opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1);max-width:86vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast em{color:var(--yellow);font-style:normal}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.daypill.today .dnum::after{content:'·';color:var(--org);margin-left:3px;font-weight:900}
/* floating rest-timer pill */
#tpill{position:fixed;right:14px;bottom:20px;z-index:97;display:none;background:#1c130c;border:1.5px solid var(--org);color:var(--org);font-family:var(--disp);font-size:16px;padding:11px 18px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.45);cursor:pointer}
#tpill.show{display:block}
#tpill.done{color:var(--tape);border-color:var(--tape)}
/* training heatmap */
.heat{max-width:1040px;margin:14px auto 0;padding:0 18px}
.heatcard{border:1px solid rgba(242,237,226,.14);border-radius:14px;background:rgba(242,237,226,.03);padding:12px 14px}
.heatrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.heatgrid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.hcell{width:11px;height:11px;border-radius:3px;background:rgba(242,237,226,.08)}
.hcell.l1{background:rgba(255,122,47,.35)}
.hcell.l2{background:rgba(255,122,47,.65)}
.hcell.l3{background:var(--org)}
.hcell.today{outline:1.5px solid var(--tape)}
.heatstats{font-family:var(--mono);font-size:11px;color:var(--mist);line-height:1.7}
.heatstats b{color:var(--chalk)}
/* next exercise CTA */
.nextbtn{display:none;width:100%;margin-top:12px;padding:14px;border-radius:12px;border:1.5px solid var(--org);background:rgba(255,122,47,.1);color:var(--org);font-family:var(--disp);font-size:14px;cursor:pointer}
.nextbtn.show{display:block}
.donebtn{display:none;width:100%;margin-top:12px;padding:17px;border-radius:12px;border:2px solid var(--pink,#FF2E97);background:linear-gradient(180deg,rgba(255,46,151,.22),rgba(255,46,151,.08));color:var(--pink,#FF2E97);font-family:var(--disp);font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;cursor:pointer}
.donebtn.show{display:block;animation:chipPop .3s cubic-bezier(.2,1.6,.4,1)}
.ovwbtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:var(--chalk,#eee);font-family:var(--disp);font-size:13px;letter-spacing:.08em;cursor:pointer}
.machlab{display:inline-block;margin:4px 0 2px;padding:3px 9px;border:1px solid rgba(0,240,255,.35);border-radius:99px;font-size:11px;letter-spacing:.05em;color:var(--teal,#00F0FF);background:rgba(0,240,255,.06)}
.prevline{margin:8px 0 0;font-size:12px;color:var(--mist)}
.prevline b{color:#fff;font-weight:600}
.sheetprog{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:10px}
.sheetprogfill{height:100%;background:linear-gradient(90deg,var(--teal,#00F0FF),var(--pink,#FF2E97));width:0;transition:width .4s ease}
.dayprog{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin:2px 0 12px}
.dayprogfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--teal,#00F0FF),var(--pink,#FF2E97));transition:width .4s ease}
.dayproglab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.statcard{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.03);padding:14px;margin:12px 0}
.statcard h4{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal,#00F0FF);margin:0 0 8px}
.pctrow{margin:10px 0}
.pctrow .plab{display:flex;justify-content:space-between;font-size:12px;color:var(--mist);margin-bottom:4px}
.pctrow .plab b{color:#fff;font-size:13px}
.pcttrack{height:10px;border-radius:6px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.pctfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal,#00F0FF),var(--pink,#FF2E97))}
.bigstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigstat .bs{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.02)}
.bigstat .bs b{display:block;font-family:var(--disp);font-size:22px;color:#fff}
.bigstat .bs span{font-size:11px;color:var(--mist);letter-spacing:.05em}
.statnote{font-size:11px;color:var(--mist);line-height:1.5;margin-top:8px}
.heatcard{cursor:pointer}
/* reps stepper shares wrow */
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);min-height:100vh;padding-bottom:60px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--org);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
header{padding:22px 18px 8px;max-width:640px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--org);text-transform:uppercase}
h1{font-family:var(--disp);font-size:clamp(30px,9vw,44px);line-height:.95;letter-spacing:-.01em;margin:6px 0 4px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--org)}
.sub{color:var(--mist);font-size:13.5px;line-height:1.45;max-width:46ch}
.statline{display:flex;gap:14px;margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--dim);flex-wrap:wrap}
.statline b{color:var(--chalk);font-weight:600}

/* ---------- day rail ---------- */
.rail{position:sticky;top:0;z-index:30;background:linear-gradient(var(--ink) 78%,transparent);padding:12px 12px 14px;max-width:640px;margin:0 auto}
.rail-inner{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.rail-inner::-webkit-scrollbar{display:none}
.daypill{flex:1 0 auto;min-width:66px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;transition:border-color .15s, background .15s}
.daypill .dnum{font-family:var(--disp);font-size:15px;line-height:1}
.daypill .dlab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-top:3px;white-space:nowrap}
.daypill .dbar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.daypill .dbar i{display:block;height:100%;width:0%;background:var(--org);border-radius:2px;transition:width .3s}
.daypill.active{border-color:var(--org);background:var(--card)}
.daypill.active .dnum{color:var(--org)}
.daypill.rest .dnum{color:var(--teal)}

/* ---------- day view ---------- */
main{max-width:640px;margin:0 auto;padding:0 14px}
.dayhead{padding:8px 4px 14px}
.dayhead h2{font-family:var(--disp);font-size:24px;text-transform:uppercase;letter-spacing:.01em}
.dayhead .meta{display:flex;gap:10px;align-items:center;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--mist);flex-wrap:wrap}
.meta .dot{width:4px;height:4px;border-radius:50%;background:var(--dim)}
.warm{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--mist);margin-bottom:12px;line-height:1.5}
.warm b{color:var(--chalk);font-weight:600}

/* ---------- exercise card ---------- */
.exlist{display:flex;flex-direction:column;gap:9px}
.excard{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;transition:transform .08s, border-color .15s}
.excard:active{transform:scale(.985)}
.excard.done{border-color:var(--teal)}
.exthumb{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle at 32% 28%, var(--board) 0%, var(--board2) 85%);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #2e463c}
.exthumb svg{width:30px;height:30px;stroke:var(--chalk);stroke-width:2;fill:none;stroke-linecap:round}
.exmain{flex:1;min-width:0}
.exname{font-weight:600;font-size:14.5px;line-height:1.25}
.exrx{font-family:var(--mono);font-size:11px;color:var(--org-soft);margin-top:3px}
.extags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 7px;border-radius:20px;border:1px solid var(--line);color:var(--mist)}
.tag.sled{border-color:var(--org);color:var(--org)}
.tag.knee{border-color:#3f5a4e;color:var(--teal)}
.tag.phys{border-color:#5c5120;color:var(--tape)}
.exright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.exsets{font-family:var(--mono);font-size:11px;color:var(--dim)}
.exsets.full{color:var(--teal)}
.play{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--org);display:flex;align-items:center;justify-content:center}
.play::after{content:'';border-left:7px solid var(--org);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:2px}

/* rest day */
.restcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center}
.restcard h3{font-family:var(--disp);font-size:20px;color:var(--teal);text-transform:uppercase;margin-bottom:8px}
.restcard p{color:var(--mist);font-size:13.5px;line-height:1.6;max-width:40ch;margin:0 auto}

/* ---------- footer notes ---------- */
.notes{margin:22px 4px 10px;border-top:1px solid var(--line);padding-top:16px}
.notes h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.notes p{font-size:13px;color:var(--mist);line-height:1.55;margin-bottom:9px}
.notes b{color:var(--chalk);font-weight:600}
.notes .flag{color:var(--tape)}

/* ---------- modal sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(6,9,12,.72);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--panel);border-radius:22px 22px 0 0;max-width:640px;margin:0 auto;transform:translateY(104%);transition:transform .28s cubic-bezier(.32,.72,.28,1);max-height:92dvh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none}
.sheet.open{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex-shrink:0}
.sheet-scroll{overflow-y:auto;padding:6px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--disp);font-size:19px;text-transform:uppercase;line-height:1.1;padding-right:36px}
.sheet .rx{font-family:var(--mono);font-size:12px;color:var(--org-soft);margin:5px 0 12px}
.closex{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--mist);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

.board{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(115% 130% at 30% 20%, var(--board) 0%, var(--board2) 90%);border:1px solid #2e463c;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.board canvas{display:block;width:100%;height:auto}
.board .cap{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#7d9a8c}
.pausebtn{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#a9c4b6;border:1px solid #3a584b;border-radius:20px;padding:4px 10px;background:rgba(0,0,0,.25)}

.cues{margin-top:14px}
.cues h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--org);margin-bottom:7px}
.cues.mist h5{color:var(--tape)}
.cues ul{list-style:none}
.cues li{position:relative;padding:0 0 7px 18px;font-size:13.5px;line-height:1.45;color:var(--chalk)}
.cues li::before{content:'';position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--org);transform:rotate(45deg)}
.cues.mist li::before{background:var(--tape);border-radius:50%;width:6px;height:6px}
.cues.mist li{color:var(--mist)}

.setrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.setchip{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-family:var(--mono);font-size:12px;color:var(--mist);transition:all .12s}
.setchip.on{background:var(--org);border-color:var(--org);color:#1a0d02;font-weight:700}
.setlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:16px}

.timer{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{font-family:var(--mono);font-size:12px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--chalk)}
.tbtn:active{background:var(--card2)}
.tdisp{font-family:var(--disp);font-size:26px;min-width:86px;text-align:center;color:var(--org);letter-spacing:.02em}
.tdisp.idle{color:var(--dim)}
.tstop{color:var(--mist);font-size:11px}

@media (prefers-reduced-motion: reduce){ .sheet{transition:none} .sheet-backdrop{transition:none} }

/* ================= PREMIUM SKIN ================= */
body{background:
  radial-gradient(1100px 480px at 50% -140px, rgba(255,46,151,.09), transparent 60%),
  radial-gradient(900px 600px at 110% 110%, rgba(0,240,255,.05), transparent 55%),
  var(--ink)}
header{padding-top:34px}
.kicker{color:var(--org);letter-spacing:.32em;font-size:9.5px;display:flex;align-items:center;gap:12px}
.kicker::before,.kicker::after{content:'';height:1px;flex:0 0 26px;background:var(--gold-hair)}
h1{text-transform:uppercase;font-weight:700;letter-spacing:.03em;letter-spacing:.01em;font-size:clamp(38px,7vw,54px)}
h1 em{font-style:normal;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mist);font-weight:400;line-height:1.65;max-width:56ch}
.statline span{border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0))}
.statline b{color:var(--org-soft);font-weight:600}
.daypill,.excard,.gamebar,.heatcard,.chartbox{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 28px -18px rgba(0,0,0,.8)}
.daypill{border-radius:6px}
.daypill.active{border-color:var(--gold-hair);box-shadow:0 0 0 1px var(--gold-hair), 0 8px 26px -12px rgba(255,46,151,.35)}
.daypill.active .dnum{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.daypill .dbar{background:rgba(255,255,255,.07)}
.daypill .dbar i{background:var(--gold-grad)}
.excard{border-radius:6px}
.excard.done{border-color:rgba(143,168,147,.5)}
.excard:hover{border-color:var(--gold-hair)}
.tb,.wbtn,.tbtn{border-color:var(--line);border-radius:10px;letter-spacing:.1em;text-transform:uppercase;transition:border-color .15s,color .15s}
.tb:hover,.wbtn:hover,.tbtn:hover{border-color:var(--gold-hair);color:var(--org-soft)}
.tb.on{border-color:var(--org);color:var(--org)}
.gamebar{border-radius:16px;padding:13px 16px}
.flame{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.flame small{color:var(--dim);-webkit-text-fill-color:var(--dim)}
.xptrack{background:rgba(255,255,255,.07)}
.xpfill{background:var(--gold-grad)}
.lvl .lname b{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.setchip{border-radius:50%;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));transition:all .18s}
.setchip.on{background:var(--gold-grad);border-color:transparent;color:#14000B;font-weight:700;box-shadow:0 3px 12px -3px rgba(255,46,151,.6)}
.hcell{background:rgba(255,255,255,.06)}
.hcell.l1{background:rgba(255,46,151,.3)}
.hcell.l2{background:rgba(255,46,151,.6)}
.hcell.l3{background:#FF2E97}
.hcell.today{outline-color:var(--org-soft)}
.sheet{background:linear-gradient(180deg,#17171B, #101013);border-top:1px solid var(--gold-hair);box-shadow:0 -24px 60px -20px rgba(0,0,0,.85)}
.sheet h3{font-family:var(--disp);font-weight:400;letter-spacing:.015em;font-size:24px}
.board{border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}

/* ============ DEEP DESIGN PASS — NIGHT CITY ============ */

/* --- atmosphere: perspective floor grid + haze --- */
body{position:relative}
body::before{content:'';position:fixed;inset:auto 0 0 0;height:42vh;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(0,240,255,.055) 1.5px, transparent 1.5px) 0 0/100% 34px,
    linear-gradient(90deg, rgba(0,240,255,.05) 1.5px, transparent 1.5px) 0 0/56px 100%;
  -webkit-mask-image:linear-gradient(transparent, black 65%);mask-image:linear-gradient(transparent, black 65%)}
body::after{content:'';position:fixed;inset:0 0 auto 0;height:2px;z-index:50;pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--org) 30%, var(--teal) 70%, transparent)}
header,main,.heat,.rail{position:relative;z-index:1}

/* --- header: HUD hero --- */
header{padding-top:40px}
.kicker{color:var(--teal);font-family:var(--mono);font-size:10px;letter-spacing:.34em}
.kicker::before{content:'▸ ';color:var(--org)}

@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}98%{opacity:1}}
.sub{border-left:2px solid var(--org);padding-left:14px}
.statline span{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);border-radius:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}

/* --- angular cyberpunk geometry: notched corners everywhere --- */
.daypill,.excard,.gamebar,.heatcard,.nextbtn,.tb{
  border-radius:0!important;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.wbtn,.tbtn,.winp{border-radius:0!important;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}

.board::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;

  h1 em,.gamebar::after,.flame,.board::after,.setchip.on,.nextbtn.show{animation:none}

<script>
/* =========================================================
   CHALKBOARD FIGURE ENGINE
   Skeletal stick figure, forward kinematics, keyframe lerp
   ========================================================= */
const RD = Math.PI/180;
const SEG = {T:42, UA:20, FA:20, TH:27, SH:27, HEAD:8.5};
const GY = 200; // ground line y
const CW = 340, CH = 232;

function dirv(a){ return [Math.sin(a*RD), Math.cos(a*RD)]; }

function P(o){
  return Object.assign({px:160,py:146,torso:0,la:0,le:0,ra:0,re:0,lh:0,lk:0,rh:0,rk:0}, o);
}
function lerpPose(a,b,t){
  const o={};
  for(const k in a){ o[k] = a[k] + (b[k]-a[k])*t; }
  return o;
}
function easeS(t){ return .5 - .5*Math.cos(Math.PI*t); }

function joints(p){
  const pel=[p.px,p.py];
  const td=dirv(p.torso);
  const sh=[pel[0]+SEG.T*td[0], pel[1]-SEG.T*td[1]];
  const hd=[sh[0]+(SEG.HEAD+5.5)*td[0], sh[1]-(SEG.HEAD+5.5)*td[1]];
  function limb(root,a,bend,L1,L2){
    const d1=dirv(a), mid=[root[0]+L1*d1[0], root[1]+L1*d1[1]];
    const d2=dirv(a+bend), end=[mid[0]+L2*d2[0], mid[1]+L2*d2[1]];
    return [mid,end];
  }
  const [lel,lha]=limb(sh,p.la,p.le,SEG.UA,SEG.FA);
  const [rel,rha]=limb(sh,p.ra,p.re,SEG.UA,SEG.FA);
  const [lkn,lan]=limb(pel,p.lh,-p.lk,SEG.TH,SEG.SH);
  const [rkn,ran]=limb(pel,p.rh,-p.rk,SEG.TH,SEG.SH);
  return {pel,sh,hd,lel,lha,rel,rha,lkn,lan,rkn,ran};
}

const CHALK='#00F0FF', CHALK_FAR='rgba(0,240,255,.35)', PROP='#FF2E97', PROP2='#FF8AC7', BOARDLINE='rgba(255,46,151,.25)';

function seg(g,a,b){ g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }

/* ---- athlete renderer: tapered muscle capsules, glow, ghosts ---- */
function capsule(g,a,b,w1,w2,fill){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  g.beginPath();
  g.moveTo(a[0]+nx*w1, a[1]+ny*w1);
  g.lineTo(b[0]+nx*w2, b[1]+ny*w2);
  g.arc(b[0],b[1],w2, Math.atan2(ny,nx), Math.atan2(-ny,-nx));
  g.lineTo(a[0]-nx*w1, a[1]-ny*w1);
  g.arc(a[0],a[1],w1, Math.atan2(-ny,-nx), Math.atan2(ny,nx));
  g.closePath(); g.fillStyle=fill; g.fill();
}

function drawFigure(g,p,opt){
  opt=opt||{};
  const J=joints(p);
  const plant = opt.plant!==false;
  const ghost = !!opt.ghost;
  const power = opt.power||0;
  const cNear = ghost ? opt.ghostColor : CHALK;
  const cFar  = ghost ? opt.ghostColor : CHALK_FAR;

  g.save();
  if(ghost){ g.globalAlpha = opt.ghostAlpha; }
  else if(power>0.04 && !ghost){
    g.shadowColor='rgba(255,46,151,'+(0.28+0.5*power)+')';
    g.shadowBlur=4+13*power;
  }

  function foot(an,col){
    const ty = plant ? Math.min(an[1]+9, GY-2) : an[1]+4;
    capsule(g,an,[an[0]+11,ty],2.6,2.0,col);
  }
  // far side
  capsule(g,J.sh,J.lel,3.6,2.7,cFar); capsule(g,J.lel,J.lha,2.7,1.9,cFar);
  capsule(g,J.pel,J.lkn,4.4,3.1,cFar); capsule(g,J.lkn,J.lan,3.1,2.1,cFar); foot(J.lan,cFar);
  // torso: broad shoulders tapering to hips + neck
  capsule(g,J.pel,J.sh,4.8,7.6,cNear);
  capsule(g,J.sh,J.hd,3.4,2.2,cNear);
  // near side
  capsule(g,J.pel,J.rkn,4.6,3.2,cNear); capsule(g,J.rkn,J.ran,3.2,2.2,cNear); foot(J.ran,cNear);
  capsule(g,J.sh,J.rel,3.8,2.8,cNear); capsule(g,J.rel,J.rha,2.8,2.0,cNear);
  // head
  g.beginPath(); g.arc(J.hd[0],J.hd[1],SEG.HEAD,0,Math.PI*2);
  g.fillStyle=cNear; g.fill();
  g.restore();
  return J;
}

/* ---------- prop helpers ---------- */
function ground(g,scrollX){
  g.strokeStyle=BOARDLINE; g.lineWidth=2;
  seg(g,[0,GY+2],[CW,GY+2]);
  g.save();
  g.strokeStyle='rgba(190,215,200,.18)'; g.lineWidth=2; g.setLineDash([9,14]);
  g.lineDashOffset = -(scrollX||0);
  seg(g,[0,GY+9],[CW,GY+9]);
  g.restore();
}
function plate(g,pt,r){
  g.strokeStyle=PROP; g.lineWidth=3;
  g.beginPath(); g.arc(pt[0],pt[1],r,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(pt[0],pt[1],1.6,0,Math.PI*2); g.fillStyle=PROP; g.fill();
}
function barbell(g,hand){ // side view: bar hint + plate at hand
  g.strokeStyle=PROP; g.lineWidth=2.4;
  seg(g,[hand[0]-13,hand[1]],[hand[0]+13,hand[1]]);
  plate(g,hand,7.5);
}
function dumbbell(g,hand){
  g.strokeStyle=PROP; g.lineWidth=3;
  seg(g,[hand[0]-6,hand[1]],[hand[0]+6,hand[1]]);
  g.lineWidth=6.5;
  seg(g,[hand[0]-6,hand[1]-3.4],[hand[0]-6,hand[1]+3.4]);
  seg(g,[hand[0]+6,hand[1]-3.4],[hand[0]+6,hand[1]+3.4]);
}
function benchRect(g,x,y,w,h){
  g.strokeStyle=BOARDLINE; g.lineWidth=2.4;
  g.strokeRect(x,y,w,h);
  seg(g,[x+8,y+h],[x+8,GY]); seg(g,[x+w-8,y+h],[x+w-8,GY]);
}
function cable(g,from,to){
  g.save(); g.strokeStyle=PROP2; g.lineWidth=2; g.setLineDash([5,4]);
  seg(g,from,to); g.restore();
  g.fillStyle=PROP2; g.beginPath(); g.arc(from[0],from[1],3,0,Math.PI*2); g.fill();
}

bike:{ dur:2, mode:'custom',
  draw(g,t){
    ground(g,0);
    const th = t*2*Math.PI*1.15;
    const C=[168,181], r=12;
    const hubR=[130,178], hubF=[214,178], wr=21;
    // wheels + spokes
    g.strokeStyle=BOARDLINE; g.lineWidth=2.6;
    for(const hub of [hubR,hubF]){
      g.beginPath(); g.arc(hub[0],hub[1],wr,0,Math.PI*2); g.stroke();
      for(let i=0;i<3;i++){
        const a=th*.8+i*Math.PI/1.5;
        seg(g,hub,[hub[0]+wr*Math.cos(a), hub[1]+wr*Math.sin(a)]);
      }
    }
    // frame
    const seat=[147,146], bar=[203,138];
    g.strokeStyle=PROP; g.lineWidth=3;
    seg(g,seat,C); seg(g,C,hubR); seg(g,seat,[hubR[0],hubR[1]-4]);
    seg(g,C,[bar[0]-6,bar[1]+16]); seg(g,[bar[0]-6,bar[1]+16],hubF); seg(g,[bar[0]-6,bar[1]+16],bar);
    seg(g,[seat[0]-9,seat[1]],[seat[0]+7,seat[1]]);
    // rider
    const pel=[seat[0]+1,seat[1]-5];
    const torso=34;
    const sh=[pel[0]+SEG.T*Math.sin(torso*RD), pel[1]-SEG.T*Math.cos(torso*RD)];
    const hd=[sh[0]+(SEG.HEAD+5.5)*Math.sin((torso-6)*RD), sh[1]-(SEG.HEAD+5.5)*Math.cos((torso-6)*RD)];
    function ik(hip,tgt,bendSign){
      let dx=tgt[0]-hip[0], dy=tgt[1]-hip[1];
      let D=Math.hypot(dx,dy); const L=SEG.TH;
      D=Math.min(D, L*2-.5);
      const a=Math.acos(D/(2*L));
      const base=Math.atan2(dx,dy);
      const ka=base+bendSign*a;
      return [hip[0]+L*Math.sin(ka), hip[1]+L*Math.cos(ka)];
    }
    const pedL=[C[0]+r*Math.cos(th), C[1]+r*Math.sin(th)];
    const pedR=[C[0]+r*Math.cos(th+Math.PI), C[1]+r*Math.sin(th+Math.PI)];
    // far leg
    let kn=ik(pel,pedL,1);
    capsule(g,pel,kn,4.4,3.1,CHALK_FAR); capsule(g,kn,pedL,3.1,2.1,CHALK_FAR); capsule(g,pedL,[pedL[0]+9,pedL[1]],2.4,1.9,CHALK_FAR);
    // far arm
    function ikArm(shp,tgt,bendSign){
      let dx=tgt[0]-shp[0], dy=tgt[1]-shp[1];
      let D=Math.hypot(dx,dy); const L=SEG.UA;
      D=Math.min(D, L*2-.5);
      const a=Math.acos(D/(2*L));
      const base=Math.atan2(dx,dy);
      const ea=base+bendSign*a;
      return [shp[0]+L*Math.sin(ea), shp[1]+L*Math.cos(ea)];
    }
    let el=ikArm(sh,[bar[0]-2,bar[1]+2],-1);
    capsule(g,sh,el,3.6,2.7,CHALK_FAR); capsule(g,el,[bar[0]-2,bar[1]+2],2.7,1.9,CHALK_FAR);
    // torso/head/near limbs
    capsule(g,pel,sh,4.8,7.2,CHALK);
    capsule(g,sh,hd,3.2,2.2,CHALK);
    g.beginPath(); g.arc(hd[0],hd[1],SEG.HEAD,0,Math.PI*2); g.fillStyle=CHALK; g.fill();
    kn=ik(pel,pedR,1);
    capsule(g,pel,kn,4.6,3.2,CHALK); capsule(g,kn,pedR,3.2,2.2,CHALK); capsule(g,pedR,[pedR[0]+9,pedR[1]],2.5,2.0,CHALK);
    el=ikArm(sh,bar,-1);
    capsule(g,sh,el,3.8,2.8,CHALK); capsule(g,el,bar,2.8,2.0,CHALK);
  }
},

ropes:{ dur:.85, mode:'custom',
  draw(g,t){
    ground(g,0);
    const u = easeS(Math.abs(((t*2)%2)-1)); // 0..1..0
    const A=P({px:110,py:157,torso:16, la:118,le:12, ra:44,re:20, lh:22,lk:30, rh:16,rk:26});
    const B=P({px:110,py:160,torso:18, la:44,le:20, ra:118,re:12, lh:24,lk:32, rh:18,rk:28});
    const p=lerpPose(A,B,u);
    const J=drawFigure(g,p,{power:0.55+0.45*u});
    // waves
    const anchor=[316,GY-6];
    const ph = t*2*Math.PI*3;
    for(const [hand,off] of [[J.lha,0],[J.rha,Math.PI]]){
      g.strokeStyle=PROP; g.lineWidth=2.6;

        const x=hand[0]+(anchor[0]-hand[0])*s;

        const y=yBase + Math.sin(s*9 - ph + off)*16*(1-s)*(0.35+0.65*s);

/* runtime */
let raf=null, animStart=0, currentAnim=null, animPaused=false, pausedAt=0;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function easeOutQuart(t){ return 1-Math.pow(1-t,4); }
function hash01(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }

/* pose + effort(0..1) at time t — pure function, enables ghost trails */
function poseAt(a,t){
  const n=a.frames.length;
  let fpos, effort;
  if(a.mode==='loop'){
    const cyc=(t/a.dur)%1;
    fpos=cyc*n;
    effort=0.4+0.2*Math.abs(Math.sin(cyc*Math.PI*2));
  }else{
    const cyc=(t/a.dur)%2;
    let u;
    if(cyc<1){ u=easeOutQuart(cyc); effort=Math.min(1, cyc*2.6)*(1-0.35*cyc); } // explosive concentric
    else     { u=1-easeS(cyc-1);    effort=0.12; }                              // controlled negative
    fpos=u*(n-1);
  }
  let i0,i1,ft;
  if(a.mode==='pp'){ i0=Math.min(Math.floor(fpos),n-2); i1=i0+1; ft=fpos-i0; }
  else { i0=Math.floor(fpos)%n; i1=(i0+1)%n; ft=easeS(fpos-Math.floor(fpos)); }
  return {p:lerpPose(a.frames[i0],a.frames[i1],ft), effort};
}

function speedLines(g,t,scroll){
  g.save();
  const dir = scroll>0 ? 1 : -1, sp=Math.abs(scroll)*2.4+60;
  for(let i=0;i<6;i++){
    const h=hash01(i), y=52+h*118;
    let x=((h*520 + t*sp) % (CW+90)) - 45;
    if(dir>0) x=CW-x;
    const len=20+h*26;
    g.strokeStyle='rgba(242,237,226,'+(0.05+0.07*h)+')';
    g.lineWidth=1.6;
    seg(g,[x,y],[x+len*dir,y]);
  }
  g.restore();
}
function dustFX(g,t,J,scroll){
  const dir = scroll>0 ? 1 : -1;
  const f=1/0.85;
  for(let k=0;k<4;k++){
    const u=((t*f)+hash01(k)*0.9)%1;
    const h=hash01(k+9);
    const ax=(k%2? J.lan:J.ran)[0];
    const x=ax - dir*(6+u*(16+12*h));
    const y=GY-2 - u*(7+8*h);
    g.fillStyle='rgba(242,237,226,'+((1-u)*0.30)+')';
    g.beginPath(); g.arc(x,y,0.8+1.1*(1-u),0,Math.PI*2); g.fill();
  }
}

function renderAnim(canvas, key, tOverride){
  const a=ANIMS[key]; if(!a) return;
  const g=canvas.getContext('2d');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  if(canvas.width!==CW*dpr){ canvas.width=CW*dpr; canvas.height=CH*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,CW,CH);
  const t = tOverride!==undefined ? tOverride : ((performance.now()-animStart)/1000);
  if(a.mode==='custom'){ a.draw(g, t/a.dur); return; }

  const {p,effort}=poseAt(a,t);
  const fx = !reduceMotion;

  // power shake on hard effort / heavy travel
  if(fx && (a.scroll || effort>0.55)){
    const amp=(a.scroll?0.7:0)+(effort>0.55?(effort-0.55)*2.2:0);
    g.save();
    g.translate(Math.sin(t*53)*amp, Math.cos(t*47)*amp*0.6);
  }

  ground(g, a.scroll ? t*a.scroll : 0);
  if(fx && a.scroll) speedLines(g,t,a.scroll);
  if(a.props) a.props(g, joints(p), p, t);

  // ghost motion trails
  if(fx){
    for(const [dt,al] of [[0.11,0.07],[0.055,0.13]]){
      const gp=poseAt(a,Math.max(0,t-dt)).p;
      drawFigure(g,gp,{plant:a.plant!==false, ghost:true,
        ghostColor:'rgba(255,46,151,1)', ghostAlpha:al});
    }
  }

  const J=drawFigure(g,p,{plant:a.plant!==false, power:effort});
  if(fx && a.scroll) dustFX(g,t,J,a.scroll);
  if(fx && (a.scroll || effort>0.55)) g.restore();
}

function startAnim(canvas,key){
  stopAnim();
  currentAnim={canvas,key};
  animStart=performance.now(); animPaused=false;
  if(reduceMotion){ animPaused=true; pausedAt=0; renderAnim(canvas,key,0); return; }
  const loop=()=>{ renderAnim(canvas,key); raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop);
}
function stopAnim(){ if(raf){ cancelAnimationFrame(raf); raf=null; } currentAnim=null; }
function togglePause(btn){
  if(!currentAnim) return;
  if(animPaused){
    animStart=performance.now()-pausedAt*1000; animPaused=false;
    const loop=()=>{ renderAnim(currentAnim.canvas,currentAnim.key); raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop);
    btn.textContent='Pause';
  }else{
    pausedAt=(performance.now()-animStart)/1000;
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    animPaused=true;
    btn.textContent='Play';
  }
}

/* v2 model: {v:2, chips:{d:{e:n}}, log:[{t,d,e,w}], lastW:{e:w}, xp, streak:{count,lastDay,best}, badges:{}} */
let progress = null; // set via migrate() in loadProgress
function baseModel(){ return {v:2, week:null, chips:{}, log:[], lastW:{}, lastR:{}, machine:{}, days:{}, xp:0, lastBackup:0, streak:{count:0,lastDay:null,best:0}, badges:{}}; }
function migrate(p){
  const b=baseModel();
  if(p && p.v===2){
    const m=Object.assign(b, p);                      // fill any keys older v2 saves lack
    if(!Object.keys(m.days).length && m.log.length){  // backfill training days from log
      m.log.forEach(l=>{ const d=new Date(l.t); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); m.days[k]=(m.days[k]||0)+1; });
    }
    return m;
  }
  b.chips=(p&&typeof p==='object')?p:{};
  return b;
}
/* history survives exercise renames */
const EX_HISTORY_ALIASES={'Dips':['Triceps Pushdown']};
function allNamesFor(exName){ return [exName].concat(EX_HISTORY_ALIASES[exName]||[]); }
function weekKey(){ const d=new Date(); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return d.getFullYear()+'-W'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function resetWeekIfNeeded(){
  const wk=weekKey();
  if(progress.week!==wk){ progress.chips={}; progress.week=wk; saveProgress(); }
}
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

const LEVELS=['Rookie','Showing Up','Consistent','Dialed In','Sled Apprentice','Engine Builder','Machine','Relentless','Sled Lord','The Long Game'];
function levelFromXp(xp){ return Math.min(LEVELS.length-1, Math.floor(Math.sqrt(xp/120))); }
function xpForLevel(l){ return 120*l*l; }

function updateGamebar(){
  const st=progress.streak, xp=progress.xp, lv=levelFromXp(xp);
  const lo=xpForLevel(lv), hi=xpForLevel(lv+1);
  const pct = lv>=LEVELS.length-1 ? 100 : Math.round(100*(xp-lo)/(hi-lo));
  const f=document.getElementById('flame');
  if(f) f.innerHTML='🔥 '+st.count+'<small>day streak · best '+st.best+'</small>';
  const t=document.getElementById('ltitle'), x=document.getElementById('lxp'), b=document.getElementById('xpfill');
  if(t) t.textContent='Lv '+(lv+1)+' · '+LEVELS[lv];
  if(x) x.textContent=xp+' XP';
  if(b) b.style.width=pct+'%';
}

function bumpStreak(){
  const st=progress.streak, tk=todayKey();
  if(st.lastDay===tk) return null;
  const gap = st.lastDay ? daysBetween(st.lastDay,tk) : 999;
  st.count = (gap<=2) ? st.count+1 : 1;   // rest day + one life day won't break it
  st.lastDay = tk;
  if(st.count>st.best) st.best=st.count;
  const milestones=[3,7,14,30,50,100];
  return milestones.includes(st.count) ? st.count : null;
}

function award(id, msg){
  if(progress.badges[id]) return false;
  progress.badges[id]=Date.now();
  toast(msg); return true;
}
function totalSets(){ let n=0; for(const d in progress.chips) for(const e in progress.chips[d]) n+=progress.chips[d][e]; return n; }

/* ---- one set completed: xp, streak, weight log, PR, celebrations ---- */
function onSetLogged(di, exName, weight, reps){
  progress.xp += 10;
  progress.days[todayKey()]=(progress.days[todayKey()]||0)+1;
  if(navigator.vibrate) navigator.vibrate(28);
  const ms = bumpStreak();
  let prMsg=null;
  if(weight && weight>0){
    const names=allNamesFor(exName);
    const prev = progress.log.filter(l=>names.includes(l.e)).reduce((m,l)=>Math.max(m,l.w||0),0);
    progress.log.push({t:Date.now(), d:di, e:exName, w:weight, r:reps||0});
    progress.lastW[exName]=weight;
    if(reps) progress.lastR[exName]=reps;
    if(prev>0 && weight>prev){
      progress.xp += 25;
      prMsg = '<em>NEW PR!</em> '+exName+' · '+weight+' kg';
      if(!progress.prs) progress.prs=[];
      progress.prs.push(Date.now());
    }
    if(prev===0) award('first_w','First weight logged — the graph begins 📈');
  }
  award('first_set','First set in the books. It counts. 💪');
  const ts=totalSets();
  if(ts===100) award('s100','<em>100 total sets.</em> Habit installed. 🧱');
  if(ts===500) award('s500','<em>500 sets.</em> This is who you are now. 🏛️');
  if(ms){ toast('🔥 <em>'+ms+'-day streak!</em> Momentum is the program.'); confetti(); }
  if(prMsg){ toast(prMsg); confetti(); }
  checkMedals();
  saveProgress(); updateGamebar();
}
function onSetRemoved(di, exName){
  progress.xp = Math.max(0, progress.xp-10);
  const tk=todayKey();
  if(progress.days[tk]){ progress.days[tk]--; if(!progress.days[tk]) delete progress.days[tk]; }
  // drop the most recent log entry for this exercise from today
  for(let i=progress.log.length-1;i>=0;i--){
    const l=progress.log[i];
    const lk=new Date(l.t); const lkey=lk.getFullYear()+'-'+String(lk.getMonth()+1).padStart(2,'0')+'-'+String(lk.getDate()).padStart(2,'0');
    if(l.e===exName && lkey===todayKey()){ progress.log.splice(i,1); break; }
  }
  saveProgress(); updateGamebar();
}
function isDayDone(di){
  const d=DAYS[di]; if(!d||d.rest) return false;
  return d.ex.every((e,i)=>getDone(di,i)>=e.sets);
}
function checkDayComplete(di){
  const d=DAYS[di]; if(!d||d.rest) return;
  const done = d.ex.every((e,i)=>getDone(di,i)>=e.sets);
  const id='dc_'+todayKey();
  if(done && !progress.badges[id]){
    progress.badges[id]=Date.now();
    progress.xp+=50;
    toast('🏁 <em>DAY CLEARED — '+d.title+'</em> · +50 XP');
    megaConfetti(); checkMedals(); saveProgress(); updateGamebar();
  }
}

/* ---- demo data (auto-seeds once when log is empty; removable) ---- */
function seedDemoIfEmpty(){
  if(progress.log.length || progress.badges.demo_seeded) return;
  const day=(n)=>{ const d=new Date(); d.setDate(d.getDate()-n); d.setHours(10,0,0,0); return d.getTime(); };
  const demo=[
    ['Machine Chest Press',[ [6,40],[4,42.5],[2,45] ]],
    ['Lat Pulldown or Pull-ups',[ [6,45],[4,50],[2,52.5] ]],
    ['Single-Leg Leg Press',[ [6,30],[4,35],[2,37.5] ]]
  ];
  demo.forEach(([ex,sessions])=>{
    sessions.forEach(([ago,w])=>{
      progress.log.push({t:day(ago), d:0, e:ex, w, demo:1});
      progress.log.push({t:day(ago)+1200000, d:0, e:ex, w, demo:1});
    });
    progress.lastW[ex]=sessions[sessions.length-1][1];
  });
  progress.xp += 200;
  progress.streak={count:3, lastDay:(()=>{const d=new Date();d.setDate(d.getDate()-2);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(), best:3};
  progress.badges.demo_seeded=Date.now();
  saveProgress();
  setTimeout(()=>toast('Demo data loaded — open <em>Chest Press</em>, <em>Pulldown</em> or <em>Leg Press</em> to see the graphs. Remove via ✕ Demo.'),600);
}
function clearDemo(){
  progress.log = progress.log.filter(l=>!l.demo);
  progress.xp = Math.max(0, progress.xp-200);
  if(progress.badges.demo_seeded){ progress.streak={count:0,lastDay:null,best:0}; }
  // flag intentionally kept so demo never re-seeds after clearing
  ['Machine Chest Press','Lat Pulldown or Pull-ups','Single-Leg Leg Press'].forEach(e=>delete progress.lastW[e]);
  saveProgress(); updateGamebar(); toast('Demo data removed — clean slate.');
}

/* ---- training heatmap (last 8 weeks) ---- */
function renderHeat(){
  const host=document.getElementById('heat'); if(!host) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const off=(today.getDay()+6)%7;
  const start=new Date(today); start.setDate(start.getDate()-off-49);
  let cells='';
  const tk=todayKey();
  for(let w=0;w<8;w++) for(let d=0;d<7;d++){
    const dt=new Date(start); dt.setDate(start.getDate()+w*7+d);
    if(dt>today){ cells+='<span class="hcell" style="visibility:hidden"></span>'; continue; }
    const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const n=progress.days[k]||0;
    const lvl=n===0?'':n<6?' l1':n<15?' l2':' l3';
    cells+='<span class="hcell'+lvl+(k===tk?' today':'')+'"></span>';
  }
  const mon=new Date(today); mon.setDate(mon.getDate()-off);
  let wkSets=0, wkVol=0;
  for(const k in progress.days){ if(new Date(k)>=mon) wkSets+=progress.days[k]; }
  progress.log.forEach(l=>{ if(l.t>=mon.getTime() && l.w) wkVol+=l.w*(l.r||1); });
  host.innerHTML='<div class="heatcard" onclick="openStats()"><div class="heatrow">'
    +'<div class="heatgrid">'+cells+'</div>'
    +'<div class="heatstats">last 8 weeks<br>this week: <b>'+wkSets+' sets</b>'
    +(wkVol?' · <b>'+Math.round(wkVol).toLocaleString()+' kg</b> moved':'')+'<br><span style="color:var(--teal,#00F0FF)">tap for analytics ▸</span></div>'
    +'</div></div>';
}

/* ---- toast + confetti ---- */
let toastT=null;
function toast(html){
  const el=document.getElementById('toast'); if(!el) return;
  el.innerHTML=html; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800);
}
function megaConfetti(){ crtGlitch(); }
function crtGlitch(){
  const cv=document.getElementById('confetti'); if(!cv) return;
  if(navigator.vibrate) navigator.vibrate([40,30,120,30,40,30,220]);
  if(reduceMotion) return;
  const g=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const W=cv.width, H=cv.height;
  const app=document.body;
  const DUR=2.2, t0=performance.now();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  (function frame(now){
    const el=(now-t0)/1000;
    if(el>=DUR){
      g.clearRect(0,0,W,H);
      app.style.transform=''; app.style.filter='';
      return;
    }
    const power = el<.35 ? 1 : el>DUR-.6 ? Math.max(0,(DUR-el)/.6) : .75; // hits hard, settles, fades
    g.clearRect(0,0,W,H);
    // screen shake + skew on the app itself
    if(Math.random()<.85*power){
      app.style.transform='translate('+rnd(-7,7)*power+'px,'+rnd(-4,4)*power+'px) skewX('+rnd(-1.2,1.2)*power+'deg)';
    } else app.style.transform='';
    // opening flashes
    if(el<.18){
      g.fillStyle=['#fff','#00F0FF','#FF2E97'][Math.floor(el*22)%3];
      g.globalAlpha=.55*(1-el/.18); g.fillRect(0,0,W,H); g.globalAlpha=1;
    }
    // horizontal tear slices with RGB split
    const slices=Math.floor(rnd(4,9)*power)+2;
    for(let i=0;i<slices;i++){
      const y=Math.random()*H, h=rnd(6,42), off=rnd(-70,70)*power;
      g.globalAlpha=rnd(.15,.4);
      g.fillStyle='#00F0FF'; g.fillRect(off-8, y, W, h);
      g.fillStyle='#FF2E97'; g.fillRect(-off+8, y+2, W, h);
      g.globalAlpha=1;
    }
    // rolling sync bar drifting down
    const by=((el*.9)%1)*H;
    const grd=g.createLinearGradient(0,by-50,0,by+70);
    grd.addColorStop(0,'rgba(255,255,255,0)'); grd.addColorStop(.5,'rgba(255,255,255,'+(.14*power)+')'); grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.fillRect(0,by-50,W,120);
    // scanlines
    g.globalAlpha=.10*power; g.fillStyle='#000';
    for(let y=0;y<H;y+=4) g.fillRect(0,y,W,2);
    g.globalAlpha=1;
    // static noise
    const grains=Math.floor(220*power);
    for(let i=0;i<grains;i++){
      g.fillStyle=Math.random()<.5?'rgba(255,255,255,.25)':'rgba(0,240,255,.2)';
      g.fillRect(Math.random()*W, Math.random()*H, rnd(1,3), rnd(1,3));
    }
    // glitching chromatic DAY CLEARED
    const fs=Math.min(64, W*.13);
    g.font='700 '+fs+'px Orbitron, sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    const tx=W/2, ty=H*.42;
    const j=()=>rnd(-6,6)*power;
    g.globalAlpha=.9;
    g.fillStyle='#00F0FF'; g.fillText('DAY CLEARED', tx+j()-4, ty+j());
    g.fillStyle='#FF2E97'; g.fillText('DAY CLEARED', tx+j()+4, ty+j());
    g.fillStyle='#fff';    g.fillText('DAY CLEARED', tx+rnd(-2,2)*power, ty+rnd(-2,2)*power);
    // occasional horizontal duplicate ghost
    if(Math.random()<.3*power){ g.globalAlpha=.35; g.fillText('DAY CLEARED', tx+rnd(-60,60), ty+rnd(-30,30)); }
    g.globalAlpha=1;
    requestAnimationFrame(frame);
  })(t0);
}
function confetti(){
  const cv=document.getElementById('confetti'); if(!cv||reduceMotion) return;
  const g=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FF2E97','#00F0FF','#FCEE0A','#FDEFF8'];
  const ps=Array.from({length:90},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*140,
    vx:(Math.random()-.5)*2.4, vy:2.5+Math.random()*3.4,
    r:3+Math.random()*4, a:Math.random()*Math.PI, va:(Math.random()-.5)*.3,
    c:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0=performance.now();
  (function fall(now){
    const el=(now-t0)/1000;
    g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      g.save(); g.translate(p.x,p.y); g.rotate(p.a);
      g.fillStyle=p.c; g.globalAlpha=Math.max(0,1-el/1.8);
      g.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2); g.restore();
    });
    if(el<1.9) requestAnimationFrame(fall); else g.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
/* storage: localStorage (iPhone PWA / browser) -> window.storage (Claude preview) -> memory */
const HAS_LS = (()=>{ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
const SKEY='longevity:progress';
async function loadProgress(){
  progress = baseModel();
  try{
    if(HAS_LS){
      const v=localStorage.getItem(SKEY);
      if(v) progress=migrate(JSON.parse(v));
    }else if(window.storage){
      const r=await window.storage.get(SKEY);
      if(r&&r.value) progress=migrate(JSON.parse(r.value));
    }
  }catch(e){ progress=migrate(null); }
}
function exportProgress(){
  progress.lastBackup=Date.now(); saveProgress();
  const blob=new Blob([JSON.stringify(progress,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='long-game-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importProgress(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async ev=>{
    try{
      const txt=await ev.target.files[0].text();
      progress=migrate(JSON.parse(txt));
      await saveProgress(); location.reload();
    }catch(e){ alert('Could not read that backup file.'); }
  };
  inp.click();
}
let wakeLock=null;
async function toggleWake(btn){
  try{
    if(wakeLock){ await wakeLock.release(); wakeLock=null; btn.classList.remove('on'); return; }
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{ wakeLock=null; btn.classList.remove('on'); });
    btn.classList.add('on');
  }catch(e){ alert('Keep-awake not available here \u2014 works once installed on the home screen (iOS 16.4+).'); }
}
async function saveProgress(){
  try{
    if(HAS_LS) localStorage.setItem(SKEY, JSON.stringify(progress));
    else if(window.storage) await window.storage.set(SKEY, JSON.stringify(progress));
  }catch(e){}
}
function getDone(d,i){ return (progress.chips[d]&&progress.chips[d][i])||0; }
function setDone(d,i,v){ progress.chips[d]=progress.chips[d]||{}; progress.chips[d][i]=v; saveProgress(); }

      const rows=Object.keys(byEx).map(e=>{

function medalStats(){
  const real=progress.log.filter(l=>!l.demo);
  const dc=Object.keys(progress.badges).filter(k=>k.startsWith('dc_'));
  // max cleared days in any Mon–Sun week
  const wk={};
  dc.forEach(k=>{
    const t=progress.badges[k]; const d=new Date(t); d.setHours(0,0,0,0);
    const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off);
    const key=d.toISOString().slice(0,10);
    wk[key]=(wk[key]||0)+1;
  });
  const cutoff=Date.now()-28*864e5;
  const d28=new Set(real.filter(l=>l.t>=cutoff).map(l=>new Date(l.t).toDateString())).size;
  const now=Date.now();
  return {
    daysCleared:dc.length,
    maxWeekCleared:Math.max(0,...Object.values(wk)),
    bestStreak:(progress.streak&&progress.streak.best)||0,
    tonnage:real.reduce((s,l)=>s+(l.w||0)*(l.r||1),0),
    sledSets:real.filter(l=>/sled/i.test(l.e)).length,
    nightSets:real.filter(l=>new Date(l.t).getHours()>=21).length,
    prWeek:(progress.prs||[]).filter(t=>now-t<7*864e5).length,
    consist:Math.min(100,Math.round(100*d28/24))
  };
}

/* ---------- ANALYTICS (biohacker screen) ---------- */
const BW=84; // kg bodyweight for relative-strength estimates
// e1RM-per-bodyweight anchors at percentiles [5,20,40,60,80,95] — adult male gym population, machine lifts (rough standards)
const STD={
 'Machine Chest Press':[.40,.60,.80,1.00,1.25,1.50],
 'Incline Machine Press':[.35,.52,.70,.88,1.10,1.32],
 'Lat Pulldown or Pull-ups':[.40,.55,.70,.85,1.00,1.15],
 'Chest-Supported Row':[.35,.50,.65,.80,.95,1.12],
 'Seated Leg Curl':[.25,.35,.45,.60,.75,.90],
 'Single-Leg Leg Press':[.60,.90,1.20,1.55,1.95,2.40],
 'Biceps Curls':[.15,.22,.30,.38,.47,.56]
};
const PCTS=[5,20,40,60,80,95];
// age-pool scaling: strength peaks ~25–35; 37 ≈ baseline, 25yo pool a bit stronger, 18yo pool a bit weaker
const AGE_POOL={ '37 (your age)':1.00, '25-year-olds (peak pool)':1.06 };
function e1rm(w,r){ return r>1? w*(1+r/30) : w; }
function bestE1rm(exName){
  const names=allNamesFor(exName); let best=0;
  progress.log.forEach(l=>{ if(names.includes(l.e)&&l.w&&!l.demo) best=Math.max(best,e1rm(l.w,l.r||1)); });
  return best;
}
function pctFromRatio(anchors,ratio){
  if(ratio<=anchors[0]) return Math.max(1,Math.round(5*ratio/anchors[0]));
  if(ratio>=anchors[5]) return Math.min(99,Math.round(95+4*(ratio-anchors[5])/(anchors[5]*.2)));
  for(let i=0;i<5;i++){
    if(ratio<=anchors[i+1]){
      const f=(ratio-anchors[i])/(anchors[i+1]-anchors[i]);
      return Math.round(PCTS[i]+f*(PCTS[i+1]-PCTS[i]));
    }
  }
  return 50;
}
function e1rmSessions(exName){
  const names=allNamesFor(exName), byDay={};
  progress.log.forEach(l=>{
    if(!names.includes(l.e)||!l.w) return;
    const k=new Date(l.t), kk=k.getFullYear()+'-'+String(k.getMonth()+1).padStart(2,'0')+'-'+String(k.getDate()).padStart(2,'0');
    byDay[kk]=Math.max(byDay[kk]||0, e1rm(l.w,l.r||1));
  });
  return Object.keys(byDay).sort().map(k=>({d:k,v:byDay[k]}));
}
function drawMini(cv,pts,color){
  const g=cv.getContext('2d'), W=cv.width, H=cv.height, P=14;
  g.clearRect(0,0,W,H);
  if(pts.length<2) return;
  const vs=pts.map(p=>p.v), mn=Math.min(...vs)*0.95, mx=Math.max(...vs)*1.05||1;
  const X=i=>P+(W-2*P)*i/(pts.length-1), Y=v=>H-P-(H-2*P)*(v-mn)/(mx-mn||1);
  g.strokeStyle='rgba(255,255,255,.08)'; g.lineWidth=1;
  for(let i=0;i<3;i++){ const y=P+(H-2*P)*i/2; g.beginPath(); g.moveTo(P,y); g.lineTo(W-P,y); g.stroke(); }
  g.strokeStyle=color; g.lineWidth=2.5; g.beginPath();
  pts.forEach((p,i)=>{ i?g.lineTo(X(i),Y(p.v)):g.moveTo(X(0),Y(p.v)); }); g.stroke();
  g.fillStyle=color; pts.forEach((p,i)=>{ g.beginPath(); g.arc(X(i),Y(p.v),3,0,7); g.fill(); });
}

  const wkMax=Math.max(...wk,1);

  const prCount=Object.keys(progress.badges).filter(k=>k.startsWith('dc_')).length;
  const ms=medalStats();

      +'<div style="font-size:22px">'+md.ic+'</div>'
      +'<div style="font-family:var(--disp);font-size:11px;letter-spacing:.08em;margin-top:4px;color:'+(got?'#fff':'var(--mist)')+'">'+md.n+'</div>'
      +'<div style="font-size:10px;color:var(--mist);margin-top:2px;line-height:1.4">'+md.req+'</div>'
      +(got?'<div style="font-size:9px;color:var(--pink,#FF2E97);margin-top:4px;letter-spacing:.1em">✓ EARNED</div>':'')
      +'</div>';
  }).join('');
  const earned=MEDALS.filter(md=>progress.badges[md.id]).length;
  m.innerHTML=
    '<div class="statcard"><h4>// Commendations — '+earned+'/'+MEDALS.length+'</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+medalGrid+'</div><div class="statnote">SEAL pipeline rules: medals are earned by what you log, never given. The Trident is the long game.</div></div>'
    +'<div class="statcard"><h4>// Vitals</h4><div class="bigstat">'
    +'<div class="bs"><b>'+Math.round(lifted).toLocaleString()+' kg</b><span>lifetime moved</span></div>'
    +'<div class="bs"><b>'+consist+'%</b><span>28-day consistency</span></div>'
    +'<div class="bs"><b>'+sessDays+'</b><span>sessions logged</span></div>'
    +'<div class="bs"><b>'+(progress.streak&&progress.streak.best||0)+'</b><span>best streak · '+prCount+' days cleared</span></div>'
    +'</div></div>'
    +'<div class="statcard"><h4>// Weekly tonnage — 8 weeks</h4><div style="display:flex;gap:5px;align-items:flex-end;height:74px">'+bars+'</div><div class="statnote">Total kg lifted per week (weight × reps). The line to watch during the cut: it should hold or climb while bodyweight drops.</div></div>'

    +(!real.length?'<div class="statcard"><div class="statnote">No logged sets yet — tap set chips with weight + reps and this screen comes alive.</div></div>':'');
  show('stats');

  if(e.tags.includes('sled')) return THUMB.sled;
  if(['rdl','trapbar','bench'].includes(e.anim)) return THUMB.bar;
  if(['facepull','pushdown','pallof','row','latpull'].includes(e.anim)) return THUMB.cable;
  if(e.anim==='bike') return THUMB.bike;
  if(e.anim==='ropes') return THUMB.rope;

function sessionsFor(exName){

  progress.log.forEach(l=>{
    if(!names.includes(l.e) || !l.w) return;
    const k=new Date(l.t); const kk=k.getFullYear()+'-'+String(k.getMonth()+1).padStart(2,'0')+'-'+String(k.getDate()).padStart(2,'0');
    byDay[kk]=Math.max(byDay[kk]||0, l.w);
  });
  return Object.keys(byDay).sort().map(k=>({d:k, w:byDay[k]}));
}
function lastSessionVol(exName){
  const names=allNamesFor(exName), byDay={};
  progress.log.forEach(l=>{
    if(!names.includes(l.e)||!l.w) return;
    const d=new Date(l.t), k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    byDay[k]=(byDay[k]||0)+l.w*(l.r||1);
  });
  const ks=Object.keys(byDay).sort();
  return ks.length?Math.round(byDay[ks[ks.length-1]]):0;
}
function chartHtml(exName){
  const ss=sessionsFor(exName);
  const best=ss.reduce((m,s)=>Math.max(m,s.w),0);
  const last=ss.length?ss[ss.length-1].w:0;
  return `<div class="chartwrap">
    <div class="setlabel">Progress over time</div>
    <div class="cstats">${ss.length?`<span>best <b>${best} kg</b></span><span>last <b>${last} kg</b></span><span>vol <b>${lastSessionVol(exName)} kg</b></span><span>${ss.length} session${ss.length>1?'s':''}</span>`:''}</div>
    <div class="chartbox" id="chartbox">${ss.length>=2?'<canvas id="chartCv" width="600" height="180" style="width:100%;height:auto;display:block"></canvas>':'<div class="chartempty">Log a weight with your sets — after two sessions this becomes your progress graph. 📈</div>'}</div>
  </div>`;
}
function drawChart(exName){
  const ss=sessionsFor(exName).slice(-14);
  const box=document.getElementById('chartbox'); if(!box) return;
  if(ss.length<2){ box.innerHTML='<div class="chartempty">Log a weight with your sets — after two sessions this becomes your progress graph. 📈</div>'; return; }
  if(!document.getElementById('chartCv')) box.innerHTML='<canvas id="chartCv" width="600" height="180" style="width:100%;height:auto;display:block"></canvas>';
  const cv=document.getElementById('chartCv'), g=cv.getContext('2d');
  g.clearRect(0,0,600,180);
  const pad={l:44,r:16,t:16,b:26};
  const ws=ss.map(s=>s.w);
  let lo=Math.min(...ws), hi=Math.max(...ws);
  if(lo===hi){ lo-=2.5; hi+=2.5; } else { const m=(hi-lo)*.15; lo-=m; hi+=m; }
  const X=i=>pad.l+(600-pad.l-pad.r)*(ss.length===1?0.5:i/(ss.length-1));
  const Y=w=>pad.t+(180-pad.t-pad.b)*(1-(w-lo)/(hi-lo));
  // gridlines
  g.strokeStyle='rgba(242,237,226,.12)'; g.lineWidth=1; g.font='11px ui-monospace,monospace'; g.fillStyle='rgba(242,237,226,.55)';
  [lo+(hi-lo)*.1, (lo+hi)/2, hi-(hi-lo)*.1].forEach(w=>{
    const y=Y(w);
    g.beginPath(); g.moveTo(pad.l,y); g.lineTo(600-pad.r,y); g.stroke();
    g.fillText((Math.round(w*2)/2)+'', 6, y+4);
  });
  // line
  const best=Math.max(...ws);
  g.strokeStyle='#FF2E97'; g.lineWidth=3; g.lineJoin='round'; g.beginPath();
  ss.forEach((s,i)=>{ const x=X(i),y=Y(s.w); i?g.lineTo(x,y):g.moveTo(x,y); });
  g.stroke();
  // dots (PR in yellow)
  ss.forEach((s,i)=>{
    g.beginPath(); g.arc(X(i),Y(s.w), s.w===best?6:4, 0, Math.PI*2);
    g.fillStyle = s.w===best ? '#FCEE0A' : '#FDEFF8';
    g.fill();
  });
  // x labels: first + last date
  g.fillStyle='rgba(242,237,226,.55)';
  g.fillText(ss[0].d.slice(5), pad.l-6, 174);
  const lastLbl=ss[ss.length-1].d.slice(5);
  g.fillText(lastLbl, 600-pad.r-30, 174);
}

/* suggested starting weights (kg) — shown until your first logged weight replaces them */
const DEFAULT_W = {
  'Backward Sled Drag':30,
  'VO\u2082max Sled Shuttle':15,
  'Single-Leg Leg Press':25,
  'Lying / Seated Ham Curl':30,
  'Calf Raise (machine)':50,
  'Lat Pulldown or Pull-ups':55,
  'Machine / Chest-Supported Row':45,
  'Biceps Curls':10,
  'Forward Sled Push':40,
  'Light Backward Sled Drag':20,
  'Machine Chest Press':50,
  'Incline Machine Press':35,

 'Leg Press (two-leg)':80,
  'Machine Lateral Raise':20,
  'Easy Cardio Mix':0,

  'Hand-over-Hand Rope Sled Pull':35,
  'Pallof Press':12,
  'Hip Machine \u2014 push apart (abductor)':35,

};
function prevSets(exName){
  const real=progress.log.filter(l=>l.e===exName&&!l.demo);
  if(!real.length) return null;
  const byDay={};
  real.forEach(l=>{ const d=new Date(l.t); const k=d.toDateString(); (byDay[k]=byDay[k]||[]).push(l); });
  const days=Object.keys(byDay).sort((a,b)=>new Date(a)-new Date(b));
  // last day that isn't today
  const today=new Date().toDateString();
  const prior=days.filter(k=>k!==today);
  if(!prior.length) return null;
  return byDay[prior[prior.length-1]].sort((a,b)=>a.t-b.t);
}
function prevSetsLine(exName){
  const ps=prevSets(exName);
  if(!ps) return '';
  const s=ps.map(l=> l.w? (l.w+'\u00d7'+(l.r||'?')) : (l.r? l.r+' reps':'\u2713')).join(' \u00b7 ');
  const d=new Date(ps[0].t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  return '<div class="prevline">Last time ('+d+'): <b>'+s+'</b></div>';
}
function setSeconds(e){
  // realistic seconds per set = work + rest, from the rx text
  const rx=e.rx||'';
  let m;
  if((m=rx.match(/(\d+)\s*min ON/))) return (+m[1])*60*2;           // interval rounds incl recovery
  if(/min/.test(rx)&&e.sets===1&&(m=rx.match(/(\d+)[\u2013-](\d+)\s*min/))) return ((+m[1]+ +m[2])/2)*60; // long cardio blocks
  let rest=75;
  if(/rest 2 min/.test(rx)) rest=120;
  else if((m=rx.match(/rest (\d+)(?:\u2013(\d+))? ?s/))) rest=m[2]?(+m[1]+ +m[2])/2:+m[1];
  return 45+rest;
}
function dayEstimates(di){
  const d=DAYS[di]; if(!d||d.rest) return {done:0,total:1};
  let done=0,total=0;
  d.ex.forEach((e,i)=>{
    const per=setSeconds(e);
    total+=per*e.sets;
    done+=per*Math.min(getDone(di,i),e.sets);
  });
  return {done,total:total||1};
}
function updateSheetProg(di){
  const f=document.getElementById('sheetProgFill');
  if(!f) return;
  const {done,total}=dayEstimates(di);
  f.style.width=Math.round(100*done/total)+'%';
}
function injectDayProgress(di){
  const host=document.querySelector('#scr-day .wrap')||document.querySelector('#scr-day main');
  if(!host) return;
  let bar=document.getElementById('dayprog');
  const {done,total}=dayEstimates(di);
  const pct=Math.round(100*done/total);
  const mins=Math.round((total-done)/60);
  const html='<div class="dayprogfill" style="width:'+pct+'%"></div><span class="dayproglab">'+pct+'% \u00b7 \u2248'+mins+' min left</span>';
  if(!bar){ bar=document.createElement('div'); bar.id='dayprog'; bar.className='dayprog'; host.prepend(bar); }
  bar.innerHTML=html;
}
function openSheet(di,ei,push){
  stopAnim();
  const e=DAYS[di].ex[ei]; sheetOpenFor=[di,ei]; activeDay=di;
  const nav=document.getElementById('exnav'), np=document.getElementById('expctEl');
  if(nav) nav.textContent=WD[di].toUpperCase()+' // EX '+String(ei+1).padStart(2,'0')+'/'+String(DAYS[di].ex.length).padStart(2,'0');
  if(np) np.textContent='';
  const cue=CUES[e.anim]||{c:[],m:[]};
  const chips=Array.from({length:e.sets},(_,s)=>{
    const on=getDone(di,ei)>s;
    return `<button class="setchip${on?' on':''}" data-set="${s}" aria-pressed="${on}">${s+1}</button>`;
  }).join('');

    <div class="sheetprog"><div class="sheetprogfill" id="sheetProgFill"></div></div>
    <h3>${e.name}</h3>
    ${e.mach?`<div class="machlab">🏷 ${e.mach}</div>`:''}
    <div class="rx">${e.rx}${e.tags.length?' &nbsp;·&nbsp; '+e.tags.map(t=>t==='sled'?'sled':t==='knee'?'knee-friendly':'clear w/ physio').join(' · '):''}</div>
    <div class="board">
      <canvas id="animCanvas" width="${CW}" height="${CH}" aria-label="Animated form demonstration for ${e.name}"></canvas>
      <span class="cap">Form demo · side view</span>
      <button class="pausebtn" id="pauseBtn">${reduceMotion?'Play':'Pause'}</button>
    </div>
    ${e.note?`<p style="margin-top:10px;font-size:13px;color:var(--mist);line-height:1.5">${e.note}</p>`:''}
    <div class="cues"><h5>Form cues</h5><ul>${cue.c.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="cues mist"><h5>Watch out for</h5><ul>${cue.m.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="setlabel">Weight &amp; reps — logged with each set you tap</div>
    <div class="wrow">
      <button class="wbtn" id="wminus">−2.5</button>
      <input class="winp" id="winp" type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="${progress.lastW[e.name]||DEFAULT_W[e.name]||''}">
      <button class="wbtn" id="wplus">+2.5</button>
    </div>
    <div class="wrow">
      <button class="wbtn" id="rminus">−1</button>
      <input class="winp" id="rinp" type="number" inputmode="numeric" step="1" min="0" placeholder="reps" value="${progress.lastR[e.name]||''}">
      <button class="wbtn" id="rplus">+1</button>
      <span class="wunit">empty = bodyweight / timed</span>
    </div>
    <div class="wrow">
      <span class="wunit" style="min-width:64px">⚙ setting</span>
      <input class="winp" id="minp" type="text" maxlength="24" placeholder="e.g. seat 4 · back 7" value="${(progress.machine&&progress.machine[e.name])||''}" style="text-align:left">
    </div>
    <div class="setlabel">Sets — tap as you finish</div>
    <div class="setrow">${chips}</div>
    ${prevSetsLine(e.name)}
    ${chartHtml(e.name)}
    <div class="setlabel">Rest timer</div>
    <div class="timer">
      <span class="tdisp idle" id="tdisp">0:00</span>
      <button class="tbtn" data-t="60">60 s</button>
      <button class="tbtn" data-t="90">90 s</button>
      <button class="tbtn" data-t="120">2 min</button>
      <button class="tbtn tstop" id="tstop">stop</button>
    </div>
    ${ei+1<DAYS[di].ex.length?`<button class="nextbtn${getDone(di,ei)>=e.sets?' show':''}" id="nextBtn">Next: ${DAYS[di].ex[ei+1].name} →</button>`:''}
    <button class="donebtn${isDayDone(di)?' show':''}" id="doneBtn">🏁 Day complete — back to home</button>
    <button class="ovwbtn" id="ovwBtn">▦ Day overview</button>`;
  show('ex');
  if(push!==false) history.pushState({s:'ex',di,ei},'');
  const canvas=document.getElementById('animCanvas');
  startAnim(canvas, e.anim);
  document.getElementById('pauseBtn').addEventListener('click',ev=>togglePause(ev.currentTarget));
  const wi=document.getElementById('winp'), ri=document.getElementById('rinp');
  const mi=document.getElementById('minp');
  if(mi) mi.addEventListener('change',()=>{ if(!progress.machine)progress.machine={}; const v=mi.value.trim(); if(v)progress.machine[e.name]=v; else delete progress.machine[e.name]; saveProgress(); });
  document.getElementById('wminus').addEventListener('click',()=>{ wi.value=Math.max(0,(parseFloat(wi.value)||0)-2.5); });
  document.getElementById('wplus').addEventListener('click',()=>{ wi.value=(parseFloat(wi.value)||0)+2.5; });
  document.getElementById('rminus').addEventListener('click',()=>{ ri.value=Math.max(0,(parseInt(ri.value)||0)-1); });
  document.getElementById('rplus').addEventListener('click',()=>{ ri.value=(parseInt(ri.value)||0)+1; });
  const nb=document.getElementById('nextBtn');
  if(nb) nb.addEventListener('click',()=>openSheet(di,ei+1));
  const db=document.getElementById('doneBtn');
  if(db) db.addEventListener('click',()=>{ history.pushState({s:'home'},''); goHome(false); });
  const ob=document.getElementById('ovwBtn');
  if(ob) ob.addEventListener('click',()=>openDay(di));
  updateSheetProg(di);
  sheetScroll.querySelectorAll('.setchip').forEach(ch=>{
    ch.addEventListener('click',()=>{
      const s=+ch.dataset.set, cur=getDone(di,ei);
      const nv = (cur===s+1)? s : s+1;
      setDone(di,ei,nv);
      if(nv>cur){
        onSetLogged(di, e.name, parseFloat(wi.value)||0, parseInt(ri.value)||0);
        const rs=restSecOf(e.rx);
        if(rs) startTimer(rs);
      } else { onSetRemoved(di, e.name); }
      sheetScroll.querySelectorAll('.setchip').forEach((c2,idx)=>{
        c2.classList.toggle('on', idx<nv); c2.setAttribute('aria-pressed', idx<nv);
      });
      if(nb) nb.classList.toggle('show', nv>=e.sets && ei+1<DAYS[di].ex.length);
      drawChart(e.name);
      renderRail(); renderDay(); renderHeat();
      checkDayComplete(di);
      if(db) db.classList.toggle('show', isDayDone(di));
      updateSheetProg(di);
    });
  });
  drawChart(e.name);
  sheetScroll.querySelectorAll('.tbtn[data-t]').forEach(b=>{
    b.addEventListener('click',()=>startTimer(+b.dataset.t));
  });
  document.getElementById('tstop').addEventListener('click',()=>stopTimer());
  tickTimer(); // reflect any running countdown in this sheet
}
/* global rest timer — survives sheet close, mirrors to floating pill */
let gEnd=0;
function fmt(r){ return Math.floor(r/60)+':'+String(r%60).padStart(2,'0'); }
function tickTimer(){
  const pill=document.getElementById('tpill');
  const disp=document.getElementById('tdisp');
  if(!gEnd){ if(pill) pill.classList.remove('show','done'); if(disp){disp.classList.add('idle');disp.textContent='0:00';} return; }
  const r=Math.max(0,Math.ceil((gEnd-Date.now())/1000));
  if(disp){ disp.classList.remove('idle'); disp.textContent=r>0?fmt(r):'GO'; }
  if(pill){ pill.classList.add('show'); pill.classList.toggle('done',r<=0); pill.textContent=r>0?fmt(r):'GO — next set'; }
  if(r<=0){
    gEnd=0; clearInterval(timerInt); timerInt=null;
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
    setTimeout(()=>{ const p=document.getElementById('tpill'); if(p&&!gEnd) p.classList.remove('show','done'); const d=document.getElementById('tdisp'); if(d&&!gEnd){d.classList.add('idle');d.textContent='0:00';} },2500);
  }
}
function startTimer(sec){
  gEnd=Date.now()+sec*1000;
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(tickTimer,250); tickTimer();
}
function stopTimer(){ gEnd=0; if(timerInt){clearInterval(timerInt);timerInt=null;} tickTimer(); }
function restSecOf(rx){
  let m=rx.match(/rest\s+(\d+)(?:\s*[\u2013\-]\s*(\d+))?\s*s/i);
  if(m) return +(m[2]||m[1]);
  m=rx.match(/rest\s+(\d+)\s*min/i);
  if(m) return m[1]*60;
  return 0;
}
function closeSheet(){ if(route.s==='ex') history.back(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && route.s!=='home') history.back(); });

  }
});
